<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A94B"/>
      <stop offset="100%" stop-color="#b8912f"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a1a2e"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gs)" stroke-width="2"/>
  <!-- Building / Construction -->
  <!-- Main building -->
  <rect x="70" y="60" width="60" height="85" fill="none" stroke="url(#gs)" stroke-width="3" rx="2"/>
  <!-- Windows grid -->
  <rect x="80" y="70" width="12" height="12" fill="url(#gs)" rx="1"/>
  <rect x="108" y="70" width="12" height="12" fill="url(#gs)" rx="1"/>
  <rect x="80" y="90" width="12" height="12" fill="url(#gs)" rx="1"/>
  <rect x="108" y="90" width="12" height="12" fill="url(#gs)" rx="1"/>
  <rect x="80" y="110" width="12" height="12" fill="url(#gs)" rx="1"/>
  <rect x="108" y="110" width="12" height="12" fill="url(#gs)" rx="1"/>
  <!-- Door -->
  <rect x="92" y="125" width="16" height="20" fill="url(#gs)" rx="2"/>
  <!-- Crane arm -->
  <line x1="130" y1="145" x2="130" y2="40" stroke="url(#gs)" stroke-width="3" stroke-linecap="round"/>
  <line x1="130" y1="40" x2="170" y2="40" stroke="url(#gs)" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="40" x2="170" y2="55" stroke="url(#gs)" stroke-width="2" stroke-linecap="round"/>
  <!-- Crane base triangle -->
  <line x1="125" y1="55" x2="135" y2="55" stroke="url(#gs)" stroke-width="2" stroke-linecap="round"/>
</svg>
